; PHP-FPM pool. Sized for a 1-CPU / 1GB-RAM container; tune `pm.max_children`
; against (container_memory / average_request_memory). The dynamic strategy
; keeps a small idle pool so cold-start latency stays low under burst.
[www]
user = www-data
group = www-data

listen = 0.0.0.0:9000
listen.backlog = 511

pm = dynamic
pm.max_children = 16
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000

; nginx polls these — see docker/nginx/default.conf
pm.status_path = /fpm-status
ping.path = /fpm-ping

; Forward worker stderr/stdout to the container so structured JSON logs
; aren't swallowed.
catch_workers_output = yes
decorate_workers_output = no

; Send access logs to stdout in a compact format.
access.log = /proc/self/fd/2
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{milli}d %{kilo}M %C%%"

clear_env = no
