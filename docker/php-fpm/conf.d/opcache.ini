; Opcache — production preset. Keep `validate_timestamps=0` so opcache never
; restats files; deploys must rebuild the image (or run `cachetool` to clear)
; otherwise old bytecode sticks around.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=1
opcache.fast_shutdown=1

; JIT — tracing JIT, ~100MB buffer. Worth measuring before bumping further;
; on a JSON API workload the win is modest (~5–10%) but free.
opcache.jit=tracing
opcache.jit_buffer_size=100M
