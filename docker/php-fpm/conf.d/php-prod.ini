; Production PHP tuning. Logs go to stderr so the container runtime captures
; them; the application's own structured JSON logger writes to stdout (see
; `Framework\Logging\LoggerFactory`).
expose_php=Off
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/dev/stderr
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT

; Conservative request limits — bump per app needs.
memory_limit=256M
post_max_size=16M
upload_max_filesize=8M
max_execution_time=30

; Session security defaults — Antarctic's primary auth is JWT, but the legacy
; session path still exists for some flows.
session.cookie_httponly=1
session.cookie_secure=1
session.cookie_samesite=Lax
session.use_strict_mode=1

date.timezone=UTC
