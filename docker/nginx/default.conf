# Antarctic — nginx fronting PHP-FPM. SPA assets under /app/* are served
# directly; everything else is forwarded to FPM. TLS terminates upstream of
# this server (load balancer / k8s ingress); set X-Forwarded-Proto so the
# app's TraceId/HTTPS detection works (`APP_TRUST_PROXY=1`).

upstream php_fpm {
    server php-fpm:9000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    # Hide nginx version + harden against common mistakes.
    server_tokens off;
    client_max_body_size 16m;

    # SPA fallback — drop-in build at html/app/. Bypasses the PHP entry.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # FPM health probes — internal only.
    location ~ ^/(fpm-status|fpm-ping)$ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        fastcgi_pass php_fpm;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Static file passthrough for anything that exists on disk; otherwise the
    # request is rewritten to the single PHP entry point.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # PHP front controller.
    location ~ ^/index\.php$ {
        fastcgi_pass php_fpm;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;

        fastcgi_read_timeout 30s;
        fastcgi_buffers 8 16k;
        fastcgi_buffer_size 32k;
    }

    # Block direct access to any other .php file (defense in depth — there
    # should only be one entry point).
    location ~ \.php$ {
        return 404;
    }

    # Don't let dotfile leaks happen (e.g. /.git/, /.env).
    location ~ /\. {
        deny all;
    }
}
