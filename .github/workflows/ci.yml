name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, pdo_pgsql, iconv, mbstring
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: src/vendor
          key: ${{ runner.os }}-php82-${{ hashFiles('src/composer.json') }}
          restore-keys: ${{ runner.os }}-php82-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint PHP syntax
        run: find Framework tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: PHPUnit
        run: vendor/bin/phpunit --no-coverage
